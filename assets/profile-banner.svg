<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="55%" stop-color="#101522"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>

    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00FF9C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101522" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0.95"/>
    </linearGradient>

    <pattern id="eng-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-width="0.6" stroke-opacity="0.08"/>
      <circle cx="40" cy="40" r="1" fill="#00E5FF" fill-opacity="0.18"/>
    </pattern>

    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="12" fill="url(#bg-base)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="1200" height="320" rx="12" fill="url(#eng-grid)"/>

  <!-- Ambient Nodes -->
  <circle cx="980" cy="70" r="140" fill="#8B5CF6" fill-opacity="0.06" filter="url(#cyan-glow)"/>
  <circle cx="180" cy="250" r="160" fill="#00E5FF" fill-opacity="0.05" filter="url(#cyan-glow)"/>

  <!-- Top System Telemetry Bar -->
  <g transform="translate(50, 36)">
    <rect x="0" y="0" width="10" height="10" rx="2" fill="#00FF9C"/>
    <text x="20" y="9" fill="#00FF9C" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="2.5">
      ALI // DIGITAL ENGINEERING LAB
    </text>
    <text x="310" y="9" fill="#94A3B8" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="11" letter-spacing="1.5">
      [SYS.NODE: IN-GZB-2026]
    </text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 30 55 L 30 22 L 65 22" fill="none" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M 1170 265 L 1170 298 L 1135 298" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Main Developer Identity -->
  <g transform="translate(50, 118)">
    <text x="0" y="0" fill="#E6EDF3" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">
      MOHD ALI KHAN
    </text>
    
    <text x="2" y="42" fill="#00E5FF" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="17" font-weight="500" letter-spacing="0.8">
      Full-Stack Software Engineer  //  Java &amp; Cloud Systems  //  Cybersecurity
    </text>

    <text x="2" y="78" fill="#94A3B8" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="400">
      Building practical software. Exploring intelligent systems. Engineering with purpose.
    </text>
  </g>

  <!-- Bottom Metadata Pills -->
  <g transform="translate(50, 232)">
    <rect x="0" y="0" width="330" height="32" rx="6" fill="#101522" stroke="#1E293B" stroke-width="1"/>
    <text x="14" y="20" fill="#E6EDF3" font-family="'Fira Code', monospace" font-size="12">
      <tspan fill="#00E5FF">EDU:</tspan> B.Tech CSIT @ KIET Ghaziabad
    </text>

    <rect x="345" y="0" width="290" height="32" rx="6" fill="#101522" stroke="#1E293B" stroke-width="1"/>
    <text x="359" y="20" fill="#E6EDF3" font-family="'Fira Code', monospace" font-size="12">
      <tspan fill="#8B5CF6">FOCUS:</tspan> Full-Stack • DSA • AI
    </text>

    <rect x="650" y="0" width="185" height="32" rx="6" fill="#101522" stroke="#00FF9C" stroke-width="0.8" stroke-opacity="0.5"/>
    <circle cx="668" cy="16" r="4" fill="#00FF9C"/>
    <text x="680" y="20" fill="#00FF9C" font-family="'Fira Code', monospace" font-size="12" font-weight="600">
      OPEN TO COLLAB
    </text>
  </g>

  <!-- Right Side Diagnostic Module -->
  <g transform="translate(880, 52)">
    <rect x="0" y="0" width="270" height="212" rx="8" fill="url(#panel-grad)" stroke="#1E293B" stroke-width="1.2"/>
    <line x1="0" y1="32" x2="270" y2="32" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#00E5FF"/>
    <circle cx="30" cy="16" r="4" fill="#8B5CF6"/>
    <text x="46" y="20" fill="#94A3B8" font-family="'Fira Code', monospace" font-size="11">telemetry.conf</text>

    <g transform="translate(18, 56)" font-family="'Fira Code', monospace" font-size="12">
      <text x="0" y="0" fill="#94A3B8">ARCHITECTURE</text>
      <text x="135" y="0" fill="#E6EDF3">MERN / Java</text>

      <text x="0" y="28" fill="#94A3B8">SECURITY LAB</text>
      <text x="135" y="28" fill="#00E5FF">AEGIS AI</text>

      <text x="0" y="56" fill="#94A3B8">CLOUD ENV</text>
      <text x="135" y="56" fill="#8B5CF6">AWS Cloud</text>

      <text x="0" y="84" fill="#94A3B8">DISCIPLINE</text>
      <text x="135" y="84" fill="#E6EDF3">Natl. Taekwondo</text>

      <line x1="0" y1="106" x2="234" y2="106" stroke="#1E293B" stroke-width="1"/>
      <text x="0" y="128" fill="#00FF9C">STATUS: ACTIVE_BUILD</text>
    </g>
  </g>

  <!-- Bottom Horizon Accent Line -->
  <rect x="50" y="296" width="1100" height="2" fill="url(#accent-line)"/>
</svg>
