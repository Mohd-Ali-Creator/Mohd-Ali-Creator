<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24">
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080B12" stop-opacity="0"/>
      <stop offset="20%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes pulseMove {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(1200px); }
      }
      .beam { animation: pulseMove 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    </style>
  </defs>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="url(#line-grad)" stroke-width="1.5"/>
  <rect class="beam" x="0" y="10" width="140" height="4" rx="2" fill="#00E5FF" opacity="0.85"/>
  <polygon points="594,12 600,6 606,12 600,18" fill="#00FF9C"/>
</svg>
